name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Hosted Box Cricket 3D URL (leave blank for default)"
        required: false
        default: "https://ais-pre-zvp4v3wgakmcnnxwlzmq5a-611650499151.asia-east1.run.app"
  push:
    paths:
      - "android-tv-apk/**"
      - ".github/workflows/build-android-tv-apk.yml"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Android TV APK
        working-directory: android-tv-apk
        run: |
          URL="${{ github.event.inputs.game_url || 'https://ais-pre-zvp4v3wgakmcnnxwlzmq5a-611650499151.asia-east1.run.app' }}"
          gradle assembleRelease -PappUrl="$URL" --no-daemon

      - name: Rename APK Artifact
        run: |
          cp android-tv-apk/app/build/outputs/apk/release/app-release.apk BoxCricket3D-AndroidTV.apk

      - name: Upload BoxCricket3D-AndroidTV.apk
        uses: actions/upload-artifact@v4
        with:
          name: BoxCricket3D-AndroidTV-APK
          path: BoxCricket3D-AndroidTV.apk
          retention-days: 30
