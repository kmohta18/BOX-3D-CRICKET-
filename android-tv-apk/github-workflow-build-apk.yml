name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Leave as 'local' for built-in offline APK (zero 404), or paste your permanent Cloud Run https:// URL"
        required: false
        default: "local"
  push:
    paths:
      - "android-tv-apk/**"
      - ".github/workflows/build-android-tv-apk.yml"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Game Web Assets into Android TV APK
        run: |
          mkdir -p /tmp/three-pkg
          npm install --prefix /tmp/three-pkg three@0.170.0 --no-audit --no-fund
          DEST="android-tv-apk/app/src/main/assets"
          rm -rf "$DEST"
          mkdir -p "$DEST/node_modules/three/build" "$DEST/node_modules/three/examples"
          cp index.html controller.html styles.css middled_menu.css manifest.webmanifest "$DEST/"
          cp batting.js bowling.js commentary.js config.js fielding.js modes.js net.js physics.js ui.js "$DEST/"
          cp -r src assets fonts icons "$DEST/"
          cp /tmp/three-pkg/node_modules/three/build/three.module.js "$DEST/node_modules/three/build/"
          if [ -f /tmp/three-pkg/node_modules/three/build/three.core.js ]; then
            cp /tmp/three-pkg/node_modules/three/build/three.core.js "$DEST/node_modules/three/build/"
          fi
          cp -r /tmp/three-pkg/node_modules/three/examples/jsm "$DEST/node_modules/three/examples/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK Licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Android TV Debug APK
        working-directory: android-tv-apk
        run: |
          URL="${{ github.event.inputs.game_url || 'local' }}"
          gradle assembleDebug -PappUrl="$URL" --no-daemon

      - name: Ensure /apks/BoxCricket3D.apk Exists
        run: |
          mkdir -p apks
          if [ ! -f apks/BoxCricket3D.apk ] && [ -f android-tv-apk/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android-tv-apk/app/build/outputs/apk/debug/app-debug.apk apks/BoxCricket3D.apk
          fi
          cp apks/BoxCricket3D.apk BoxCricket3D.apk
          ls -lh apks/BoxCricket3D.apk BoxCricket3D.apk

      - name: Upload BoxCricket3D.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoxCricket3D-AndroidTV-APK
          path: apks/BoxCricket3D.apk
          retention-days: 30
