<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f44"/>
      <stop offset="55%" stop-color="#09132b"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#09132b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="55%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#fbbf24" stroke-opacity="0.35" stroke-width="8"/>
  <!-- Three golden wickets -->
  <g fill="#f8fafc" opacity="0.92">
    <rect x="206" y="138" width="16" height="196" rx="8"/>
    <rect x="248" y="132" width="16" height="202" rx="8"/>
    <rect x="290" y="138" width="16" height="196" rx="8"/>
  </g>
  <rect x="202" y="128" width="52" height="10" rx="5" fill="#fbbf24"/>
  <rect x="258" y="128" width="52" height="10" rx="5" fill="#fbbf24"/>
  <!-- Angled Willow Cricket Bat -->
  <g transform="translate(260 264) rotate(-36)">
    <rect x="-11" y="-168" width="22" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <rect x="-26" y="-106" width="52" height="184" rx="14" fill="url(#bat)" stroke="#fff7ed" stroke-width="4"/>
    <rect x="-4" y="-96" width="8" height="162" rx="4" fill="#fffbeb" opacity="0.45"/>
  </g>
  <!-- Crimson Cricket Ball with Seam -->
  <g transform="translate(344 176)">
    <circle r="48" fill="url(#ball)" stroke="#fecaca" stroke-width="3"/>
    <path d="M-32 -26 C-8 -4, 8 4, 32 26" fill="none" stroke="#fef3c7" stroke-width="5" stroke-dasharray="7 6" stroke-linecap="round"/>
  </g>
  <!-- Pitch turf arc -->
  <path d="M92 388 Q256 346 420 388" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round" opacity="0.88"/>
</svg>
