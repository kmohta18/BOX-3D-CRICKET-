name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      game_url:
        description: "Leave as 'local' for built-in offline APK (zero 404), or paste your permanent Cloud Run https:// URL"
        required: false
        default: "local"
  push:
    paths:
      - "android-tv-apk/**"
      - ".github/workflows/build-android-tv-apk.yml"

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (to bundle Three.js inside APK)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Game Web Assets into Android TV APK
        run: |
          npm install three@0.170.0 --no-save --no-audit --no-fund
          DEST="android-tv-apk/app/src/main/assets"
          rm -rf "$DEST"
          mkdir -p "$DEST/node_modules/three/build" "$DEST/node_modules/three/examples"
          cp index.html styles.css middled_menu.css manifest.webmanifest "$DEST/"
          cp batting.js bowling.js commentary.js config.js fielding.js modes.js net.js physics.js ui.js "$DEST/"
          cp -r src assets fonts icons "$DEST/"
          cp node_modules/three/build/three.module.js "$DEST/node_modules/three/build/"
          if [ -f node_modules/three/build/three.core.js ]; then
            cp node_modules/three/build/three.core.js "$DEST/node_modules/three/build/"
          fi
          cp -r node_modules/three/examples/jsm "$DEST/node_modules/three/examples/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build Android TV APK
        working-directory: android-tv-apk
        run: |
          URL="${{ github.event.inputs.game_url || 'local' }}"
          gradle assembleRelease -PappUrl="$URL" --no-daemon

      - name: Rename APK Artifact
        run: |
          cp android-tv-apk/app/build/outputs/apk/release/app-release.apk BoxCricket3D-AndroidTV.apk

      - name: Upload BoxCricket3D-AndroidTV.apk
        uses: actions/upload-artifact@v4
        with:
          name: BoxCricket3D-AndroidTV-APK
          path: BoxCricket3D-AndroidTV.apk
          retention-days: 30
